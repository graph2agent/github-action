name: Reusable graph2agent check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  graph2agent:
    uses: graph2agent/github-action/.github/workflows/check-markdown.yml@b467d92b8c14a87fe977bc6a12a0f9fc685ab047
    with:
      path: .
      profile: interpreted-v3
      graph2agent-version: v0.4.0

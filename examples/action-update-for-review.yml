name: Preview graph2agent annotation update

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Replace the placeholder with an audited 40-character commit SHA.
      - uses: graph2agent/github-action@0000000000000000000000000000000000000000
        with:
          version: v0.2.0
          operation: update
          path: docs
          profile: interpreted-v3
      - name: Show the reviewable patch without publishing it
        run: |
          git diff --check
          git diff --exit-code
